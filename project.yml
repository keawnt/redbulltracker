name: CanCount
options:
  bundleIdPrefix: com.keawn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6R67XBJ349   # Keawn Tandon (Apple Developer Program)
    CODE_SIGN_STYLE: Automatic
schemes:
  CanCount:
    build:
      targets:
        CanCount: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CanCountUITests
targets:
  CanCount:
    type: application
    platform: iOS
    sources:
      - path: CanCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keawn.cancount
        CODE_SIGN_ENTITLEMENTS: CanCount/CanCount.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSCameraUsageDescription: "CanCount uses the camera to scan Red Bull barcodes."
        INFOPLIST_KEY_NSContactsUsageDescription: "Find Friends checks your contacts for people already logging cans. Numbers are hashed on your phone before anything leaves it — CanCount sees matches, never your address book."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Store Radar nudges you to log a can when you're near a gas station, corner store, or grocery. Only if you turn it on."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Always access lets Store Radar notice stores even when the app is closed. It never tracks where you've been — just whether a Red Bull is nearby."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # No custom crypto — answers App Store Connect's export-compliance
        # question automatically so every TestFlight build goes straight out.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0
  CanCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CanCountUITests
    dependencies:
      - target: CanCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keawn.cancount.uitests
        GENERATE_INFOPLIST_FILE: true
